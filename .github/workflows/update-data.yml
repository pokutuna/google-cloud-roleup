name: Update data

# Regenerates public/data/roleup.json from the IAM APIs on a weekly cron and
# opens a PR when the data changed. Test failures or the anomaly check inside
# generate-data.ts (>10% drop in roles/permissions) fail the run so a human
# has to look; nothing is force-merged past that.

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      # Install before exposing CI secrets, and never run dependency lifecycle scripts.
      - run: npm ci --ignore-scripts

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Generate data
        run: npm run generate-data

      - name: Check for changes
        id: diff
        # generatedAt is stamped on every run; ignore it so a PR (and deploy)
        # happens only when the data itself changed. The "data: ..." stamp in
        # the UI therefore shows the date of the last real data change.
        run: |
          if git show HEAD:public/data/roleup.json | jq -S 'del(.generatedAt)' \
             | cmp -s - <(jq -S 'del(.generatedAt)' public/data/roleup.json); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "generated-at=$(jq -r .generatedAt public/data/roleup.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.DATA_UPDATE_PAT }}
          branch: data-update
          commit-message: "data: update roleup.json (${{ steps.diff.outputs.generated-at }})"
          title: "data: update roleup.json (${{ steps.diff.outputs.generated-at }})"
          body: Automated update of `public/data/roleup.json` via the `update-data` workflow.
          add-paths: public/data/roleup.json

      - name: Enable auto-merge
        if: steps.diff.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.DATA_UPDATE_PAT }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
